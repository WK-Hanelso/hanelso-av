[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dopamine-av"
version = "0.1.0"
description = "dopamine-av 공용 base — 원본→통합 포맷 파싱·데이터 계약(data_devkit) + 도메인 공유 유틸. 모든 도메인이 import하는 코드 base."
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "protobuf==3.20.3",
    "cyber_record",
]

[project.optional-dependencies]
# 빌드 전용 도구. Apollo map .proto → *_pb2.py 생성(protoc)에만 필요.
# 런타임 불요(생성물은 커밋). docker base는 런타임엔 이거 제외 가능.
dev = ["grpcio-tools==1.43.0"]
# 시각화 도구(tools/parser_validation BEV 등).
viz = ["matplotlib"]

# 모노레포: 공용 base 패키지 common + 도메인 패키지들이 배포 대상.
# 원본/파생/설정은 패키지 아님.
[tool.setuptools.packages.find]
include = [
    "common*",
    "data_devkit*",
    "planning*",
    "simulation*",
    "calibration*",
    "localization*",
    "perception*",
]
namespaces = true